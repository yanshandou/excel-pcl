<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Excel Inspector · 工作簿检查</title><style>
:root{font-family:Inter,'Segoe UI','Microsoft YaHei',sans-serif;color:#19302d;background:#f3f6f5}*{box-sizing:border-box}body{margin:0}header{background:#123c36;color:white;padding:30px 5%;display:flex;justify-content:space-between;align-items:center}h1{font-size:26px;margin:5px 0}small{color:#a8c9be}main{max-width:1500px;margin:auto;padding:25px 4%}.card{background:white;border:1px solid #dde6e1;border-radius:12px;padding:22px;margin-bottom:18px}.config{display:flex;gap:16px;flex-wrap:wrap;align-items:end}label{display:block;font-size:13px;color:#536b63}input,select,button{font:inherit;border:1px solid #ccd9d3;border-radius:7px;padding:10px;background:white}input[type=number]{width:90px}button{cursor:pointer}button.primary{background:#16735b;color:white;border:0}button:disabled{opacity:.5;cursor:wait}.drop{border:1px dashed #a2bcb1;padding:22px;text-align:center;border-radius:8px;background:#f6faf8;margin:18px 0}.stats{display:flex;gap:12px;flex-wrap:wrap}.stat{flex:1;background:#eaf3ee;padding:18px;min-width:140px;border-radius:8px}.stat strong{font-size:27px;display:block}.toolbar,.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.tabs button.active{background:#163f35;color:white}.legend{font-size:13px;line-height:1.8;color:#5a6a61}.workspace{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:18px}.tablewrap{max-height:560px;overflow:auto;border:1px solid #dfe7e2;border-radius:8px}table{border-collapse:collapse;width:100%;font-size:13px}th{background:#eaf0ed;position:sticky;top:0;z-index:1;text-align:left}th,td{padding:11px;border-bottom:1px solid #dde5e0;max-width:290px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}tbody tr{cursor:pointer}tbody tr:hover{outline:2px solid #23755c;outline-offset:-2px}.pattern{background-image:repeating-linear-gradient(45deg,transparent,transparent 4px,#0002 4px,#0002 5px)}pre{font-size:12px;white-space:pre-wrap;word-break:break-word}#status{white-space:pre-line;color:#426251;font-size:14px}.empty{padding:60px;text-align:center;color:#7d8e85}details{font-size:13px;line-height:1.7}summary{cursor:pointer}#page{align-self:center;font-size:13px}#detail{overflow:auto}#detail p{word-break:break-word;font-size:13px}#error{color:#a13535}@media(max-width:850px){.workspace{grid-template-columns:1fr}header{padding:20px}main{padding:14px}}
</style><header><div><small>LOCAL WORKBOOK REVIEW</small><h1>Excel Inspector</h1><div>把工作簿检查，放到一个清晰的页面里。</div></div><small>只读检查 · 本机运行</small></header><main><section class="card"><div class="config"><label>目标字体<br><input id="font" value="ＭＳ Ｐゴシック"></label><label>目标字号<br><input id="size" type="number" min="1" max="409" value="10"></label><button id="run" class="primary">开始检查</button><button id="export">导出完整 JSON</button></div><div class="drop"><b>选择 Excel 文件，或选择整个文件夹</b><p><input aria-label="选择文件" id="files" type="file" multiple accept=".xlsx,.xlsm"> <input aria-label="选择文件夹" id="folder" type="file" webkitdirectory multiple></p><label>文件夹包含子文件夹 · 支持 .xlsx / .xlsm · 每次检查逐个处理</label></div><div id="status" role="status">尚未选择文件</div><div id="error" role="alert"></div></section><section class="card"><div class="stats"><div class="stat"><label>成功文件</label><strong id="books">0</strong></div><div class="stat"><label>工作表</label><strong id="sheets">0</strong></div><div class="stat"><label>已存储单元格</label><strong id="cells">0</strong></div><div class="stat"><label>失败文件</label><strong id="failed">0</strong></div></div><div class="toolbar"><select id="book" aria-label="文件"></select><select id="sheet" aria-label="工作表"></select><input id="search" placeholder="搜索地址、内容、字体…" aria-label="搜索"><label><input id="marked" type="checkbox"> 仅显示有颜色 / 网纹</label><select id="view" aria-label="显示方式"><option value="list">单元格列表</option><option value="grid">单元格网格（当前页）</option></select></div><details><summary>工作簿信息 · 打印范围 · 图形 · 名称管理 · 兼容说明</summary><pre id="meta">检查后显示</pre></details><div class="tabs" id="tabs"></div><div class="legend" id="legend"></div><div class="workspace"><div><div class="tablewrap" id="results"><div class="empty">选择文件后开始检查</div></div><div class="toolbar"><button id="prev">上一页</button><span id="page">0 / 0</span><button id="next">下一页</button></div></div><aside class="card" id="detail"><b>单元格详情</b><p>点击左侧单元格查看原始属性。</p></aside></div></section></main><script>
'use strict';const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const names=['显示格式','数据有无','水平对齐','垂直对齐','换行与缩小','合并单元格','字体'];const legends=['蓝：文本 @ · 绿：原 VBA 三种数值格式 · 黄：其他格式 · 无：标准','红：有值或公式；不是错误。UsedRange 边界见工作表信息。','蓝：左 · 黄：中 · 绿：右 · 红：其他指定对齐 · 无：标准','蓝：上 / 均等分布 · 黄：中 · 绿：下 · 红：两端对齐','蓝：换行 · 黄：缩小；同时启用时换行优先','蓝：合并区域；网格用边框标注，不还原跨单元格排版','蓝：字号符合 · 红：字体不符（覆盖蓝）· 网纹：粗体或非黑色'];const colors={blue:'#b9dfff',green:'#bce8c9',red:'#ffc3c3',yellow:'#ffed9c',none:'#fff'};let selected=[],reports=[],rule=0,page=0,failures=[];const batch=200;
function pick(input){selected=Array.from(input.files).filter(f=>/\.(xlsx|xlsm)$/i.test(f.name)&&!f.name.startsWith('~$'));$('status').textContent=`已选择 ${selected.length} 个文件`;}$('files').onchange=()=>pick($('files'));$('folder').onchange=()=>pick($('folder'));
$('tabs').innerHTML=names.map((n,i)=>`<button data-rule="${i}">${n}</button>`).join('');$('tabs').onclick=e=>{if(e.target.dataset.rule!==undefined){rule=+e.target.dataset.rule;page=0;render();}};
async function base64(file){const a=new Uint8Array(await file.arrayBuffer());let s='';for(let i=0;i<a.length;i+=32768)s+=String.fromCharCode(...a.subarray(i,i+32768));return btoa(s);}
$('run').onclick=async()=>{if(!selected.length){$('error').textContent='请先选择 Excel 文件';return;}if(!$('font').value.trim()||!Number.isFinite(+$('size').value)||+$('size').value<=0){$('error').textContent='请填写字体和有效字号';return;}$('run').disabled=true;reports=[];failures=[];$('error').textContent='';for(let i=0;i<selected.length;i++){const f=selected[i];$('status').textContent=`检查中 ${i+1} / ${selected.length}：${f.name}`;try{if(f.size>30*1024*1024)throw Error('文件超过 30 MB');const res=await fetch('/api/inspect',{method:'POST',headers:{'Content-Type':'application/json','X-Inspector-Token':'__TOKEN__'},body:JSON.stringify({name:f.webkitRelativePath||f.name,data:await base64(f),font:$('font').value,size:+$('size').value})});const r=await res.json();if(!res.ok)throw Error(r.error||'检查失败');reports.push(r);}catch(e){failures.push({name:f.name,error:e.message});}}$('run').disabled=false;$('status').textContent=`检查完成：${reports.length} 成功，${failures.length} 失败`;$('error').textContent=failures.map(f=>`${f.name}：${f.error}`).join('\n');$('books').textContent=reports.length;$('failed').textContent=failures.length;$('sheets').textContent=reports.reduce((n,b)=>n+b.sheets.length,0);$('cells').textContent=reports.reduce((n,b)=>n+b.sheets.reduce((n,s)=>n+s.cells.length,0),0);$('book').innerHTML=reports.map((b,i)=>`<option value="${i}">${esc(b.name)}</option>`).join('');changeBook();};
function changeBook(){const b=reports[+$('book').value];$('sheet').innerHTML=b?b.sheets.map((s,i)=>`<option value="${i}">${esc(s.name)}</option>`).join(''):'';page=0;render();}$('book').onchange=changeBook;for(const id of ['sheet','marked','view'])$(id).onchange=()=>{page=0;render();};$('search').oninput=()=>{page=0;render();};$('prev').onclick=()=>{page=Math.max(0,page-1);render();};$('next').onclick=()=>{page++;render();};
function render(){document.querySelectorAll('[data-rule]').forEach(b=>b.classList.toggle('active',+b.dataset.rule===rule));$('legend').textContent=legends[rule];const b=reports[+$('book').value],s=b?.sheets[+$('sheet').value];if(!s){$('results').innerHTML='<div class="empty">暂无检查结果</div>';return;}$('meta').textContent=JSON.stringify({文件:b.name,标题:b.title,新形式:b.new_type,工作表:{名称:s.name,最大行:s.rows,最大列:s.cols,打印范围:s.print_area,范围外:s.outside,可见性:s.state,合并区域:s.merges},图形:b.shapes,名称管理:b.names,兼容说明:b.notes},null,2);const q=$('search').value.toLowerCase();let rows=s.cells.filter(c=>(!$('marked').checked||c.colors[rule]!=='none'||rule===6&&c.pattern)&&(!q||JSON.stringify(c).toLowerCase().includes(q))).sort((a,b)=>a.row-b.row||a.col-b.col);const pages=Math.max(1,Math.ceil(rows.length/batch));page=Math.min(page,pages-1);$('page').textContent=`${page+1} / ${pages} · ${rows.length} 个单元格`;$('prev').disabled=!page;$('next').disabled=page>=pages-1;rows=rows.slice(page*batch,(page+1)*batch);let body='';if($('view').value==='list'){body='<table><thead><tr><th>单元格</th><th>内容 / 公式</th><th>分类</th><th>字体</th><th>字号</th></tr></thead><tbody>'+rows.map(c=>`<tr data-cell="${c.address}" style="background:${colors[c.colors[rule]]}" class="${rule===6&&c.pattern?'pattern':''}"><td>${c.address}${c.merge?' ⧉':''}</td><td>${esc(c.value)}</td><td>${esc({none:'无',blue:'蓝',red:'红',yellow:'黄',green:'绿'}[c.colors[rule]])}</td><td>${esc(c.font)}</td><td>${esc(c.size)}</td></tr>`).join('')+'</tbody></table>';}else{const cols=[...new Set(rows.map(c=>c.col))].sort((a,b)=>a-b),rs=[...new Set(rows.map(c=>c.row))].sort((a,b)=>a-b);const map=new Map(rows.map(c=>[c.row+','+c.col,c]));body='<table><thead><tr><th>行 / 列</th>'+cols.map(c=>`<th>${column(c)}</th>`).join('')+'</tr></thead><tbody>'+rs.map(r=>'<tr><th>'+r+'</th>'+cols.map(col=>{const c=map.get(r+','+col);return c?`<td title="${c.address}" data-cell="${c.address}" class="${rule===6&&c.pattern?'pattern':''}" style="background:${colors[c.colors[rule]]};${c.merge?'border:2px solid #6397bd':''}">${esc(c.value)||'·'}</td>`:'<td>—</td>';}).join('')+'</tr>').join('')+'</tbody></table>';} $('results').innerHTML=rows.length?body:'<div class="empty">没有符合条件的单元格</div>';}
function column(n){let s='';while(n){n--;s=String.fromCharCode(65+n%26)+s;n=Math.floor(n/26);}return s;}
$('results').onclick=e=>{const el=e.target.closest('[data-cell]');if(!el)return;const s=reports[+$('book').value].sheets[+$('sheet').value],c=s.cells.find(c=>c.address===el.dataset.cell);$('detail').innerHTML='<b>'+esc(c.address)+'</b>'+Object.entries(c).filter(([k])=>!['colors','row','col'].includes(k)).map(([k,v])=>`<p><strong>${esc(k)}</strong><br>${esc(v)}</p>`).join('');};$('export').onclick=()=>{if(!reports.length)return;const url=URL.createObjectURL(new Blob([JSON.stringify({reports,failures},null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='excel-inspection.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};render();
</script></html>
